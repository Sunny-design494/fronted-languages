<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>河南工业大学食堂美食</title>
</head>
<body>
    <header>
        <h1>校内美食推荐</h1>
    </header>
    <nav>
        <a href="#一楼">一楼</a>
        <a href="#三楼">三楼</a>
    </nav>
    <main>
        <section id="一楼篇">
          <h2>一楼篇</h2>
          <article>
            <h3>黑鸭煲</h3>
            <img src="./723282bdafafb5e228dedcf121070796.jpg" alt="加载失败"></img>
            <p>微辣美味，鸭鸭等你来品尝</p>
          </article>
        </section>
        <section id="三楼篇">
          <h2>三楼篇</h2>
          <article>
            <h3>牛肉拉面</h3>
            <img src="./5ed2e6798d868fcc24263df4c12b7c56.jpg" alt="加载失败" style="width: 100px;"><img>
            <p>香晕了，牛牛等你来吃掉</p>
          </article>
        </section>
    </main>
    <aside>
      <ol>
        <li>麻辣烫</li>
        <li>黑鸭煲</li>
        <li>酥肉小锅</li>
      </ol>
    </aside>
    <footer>
      <a href="mailto:hi@qq.com">联系我们</a>
    </footer>
    <h1>美食节活动安排表</h1>
    <table>
      <tr>
        <th >活动日期</th>
        <th>时间段</th>
        <th>活动内容</th>
        <th>活动地点</th>
      </tr>
      <tr>
        <td rowspan="2">6月16日</td>
        <td>上午9：00-12：00</td>
        <td>美食制造</td>
        <td>一号食堂大厅</td>
      </tr>
      <tr>
        <td>下午9：00-12：00</td>
        <td>美食制造</td>
        <td>一号食堂大厅</td>
      </tr>
      <tr>
        <td rowspan="2">6月17日</td>
        <td rowspan="2">全天</td>
        <td>美食制造</td>
        <td>一号食堂大厅</td>
      </tr>

    </table>
    <h1>美食节在线报名</h1>
    <form  action="" method="post">
      姓名：
      <input type="text" placeholder="请输入你的真实姓名" required><br/>
      手机号：
      <input type="text" placeholder="请输入11为手机号" required><br/>
      性别：
      <input type="radio" name="gender" value="男">男
      <input type="radio" name="gender" value="女">女<br/>
      参加项目：
      <input type="checkbox" name="item" value="美食制造">美食制造
      <input type="checkbox" name="item" value="美食品鉴">美食品鉴
      <input type="checkbox" name="item" value="小吃展销">小吃展销<br/>
      年级:
     
<label for="grade">年级：</label>
<select id="grade" name="grade">
    <option value="1">大一</option>
    <option value="2">大二</option>
    <option value="3">大三</option>
    <option value="4">大四</option>
</select><br/>


<label for="msg">留言：</label>
<textarea id="msg" name="msg" rows="4" cols="30"></textarea>

<input type="submit" value="提交报名">
    </form>
</body>
</html>
