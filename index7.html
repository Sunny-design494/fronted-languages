<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定位</title>
    <style>
        .box1{
            height: 350x;
            background-color: aquamarine;

        }
        .box-normal{
            width: 100px;
            height: 100px;
            background-color: blue;
           
        }
        .box-relative{
            width:100px;
            height:100px;
            background-color: red;
            position:relative;
            left:20px;
            top:20px;
        }
        .box2{
             height: 450x;
            background-color: yellow;
            margin-bottom:10px;
        }
        .box-absolute{
            width:100px;
            height:100px;
            left:120px;
            background-color: red;
            position:absolute;
            
        }
        .box-fixed{
            width:100px;
            height: 100px;
            background-color: pink;
            position:fixed;
            right:10px;
            bottom:10px;
        }
    </style>
</head>
<body>
    <h1>相对定位</h1>
    <div class="box1">
        <div class="box-normal"></div>
        <div class="box-relative"></div>
        <div class="box-normal"></div>
    </div>
    <h2>绝对定位</h2>
    <div class="box2">
        <div class="box-normal"></div>
        <div class="box-absolute"></div>
        <div class="box-normal"></div>
    </div>
    <h2>固定定位</h2>
    <div class="box-fixed"></div>
</body>
</html>
