<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒子模型</title>
    <style>
        .demo{
            background-color:aqua;
            display:inline-block;
            border:5px solid red;/*边框*/
            padding: 50px;
            margin: 50px ;
        }
        .border-demo{
            background-color:yellow;
            width:200px;
            height:100px;
            border:solid  purple;/*边框*/
            border-width:0 12px 12px 20px;/*上右下左*/
           
        }
    </style>
    
</head>
<body>
    <div class="demo">我非常优秀</div>
    <div class="border-demo">这是一个边框实例</div>
</body>
</html>
